# --- Site settings ---
title: Alex Kovtunov
tagline: Engineering & leadership
description: >-
  Notes on building software and building teams — from hands-on engineering
  to leading the people who ship it.
author: Alex Kovtunov
url: "https://akovtunov.github.io"
baseurl: ""
lang: en

# Social / links (edit these)
github_username: AKovtunov

# --- Build settings ---
markdown: kramdown
highlighter: rouge
permalink: /blog/:year/:month/:day/:title/

kramdown:
  input: GFM
  syntax_highlighter: rouge

# Preserve the old feed location (/atom.xml)
feed:
  path: atom.xml

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Default front matter
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - .sass-cache
